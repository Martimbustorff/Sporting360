version = 1

# config.ts holds a deliberate client-side obfuscation key (the gamebox
# passphrase). It ships in every build regardless and cannot live in .env
# (its special characters are mangled by dotenv), so it is excluded from
# analysis to avoid a false-positive secrets finding.
exclude_patterns = [
  "src/constants/config.ts"
]

[[analyzers]]
name = "javascript"

  [analyzers.meta]
  plugins = ["react"]
  environment = ["nodejs", "browser"]

[[analyzers]]
name = "secrets"
