name: S360 refereeing data validation

on:
  pull_request:
    paths:
      - "data/liga-portugal-refereeing/**"
  push:
    paths:
      - "data/liga-portugal-refereeing/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate dataset
        run: python data/liga-portugal-refereeing/validate.py
      - name: Aggregate snapshot
        run: python data/liga-portugal-refereeing/aggregate.py
      - name: Show pending review queue
        run: python data/liga-portugal-refereeing/build_review_queue.py
